task: etms
default_model: eegnet
seed: 42
device: cuda
visualize: false
sample_ratio: 1.0

parc:
  n_dims: 0.8

runtime:
  mode: auto
  backend: auto
  world_size: null
  master_addr: 127.0.0.1
  master_port: 29500
  find_unused_parameters: true
  timeout_seconds: null
  debug: false

output:
  base_dir: outputs

models:
  eegnet:
    name: eegnet
    model_folder_id: null
    params:
      dropout: 0.25
    trainer:
      lr: 1e-4
      lr_backbone: 1e-4
      batch_size: 64
      epochs: 50
      patience: 20
      clip_grad_norm: 5.0
      weight_decay: 5e-2
      label_smoothing: 0.1
      betas: [0.9, 0.999]
      eps: 1e-8
      save_every_epoch: false
  deformer:
    name: deformer
    model_folder_id: null
    params:
